.thead{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}
.thead .x{background:none;color:var(--dim);font-size:22px;padding:4px 8px}

.bar i.late{background:var(--red)}

@supports (height:100dvh){#test{--cell:min(calc((100vw - 66px) / 4),calc((100dvh - 200px) / 5),112px)}}

<body>
<div id="app"></div>
<nav id="nav"></nav>

<script id="gen">
/* ---------- puzzle generators (pure; tested in node) ---------- */
const R = n => Math.floor(Math.random() * n);
const pick = a => a[R(a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = R(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const RANGE = { type: [0, 4], num: [1, 6], size: [0, 2], color: [0, 2], itype: [0, 4], isize: [0, 2], icolor: [0, 2] };
const NEST_ATTRS = ['type', 'itype', 'isize', 'icolor'];
const ATTRS = ['type', 'num', 'size', 'color'];
const NLINES = 6;
const bits = m => { let c = 0; for (let i = 0; i < NLINES; i++) if (m >> i & 1) c++; return c; };
const rndMask = (lo, hi) => { let m; do { m = R(1 << NLINES); } while (bits(m) < lo || bits(m) > hi); return m; };

function attrGrid(a, kind) {
  const [lo, hi] = RANGE[a], g = [];
  if (kind === 'const') {
    const v = a === 'num' ? 1 + R(4) : lo + R(hi - lo + 1);
    for (let r = 0; r < 3; r++) g.push([v, v, v]);
  } else if (kind === 'prog') {
    const d = pick([1, -1]);
    for (let r = 0; r < 3; r++) {
      const s = d > 0 ? lo + R(hi - lo - 1) : lo + 2 + R(hi - lo - 1);
      g.push([s, s + d, s + 2 * d]);
    }
  } else if (kind === 'dist3') {
    const vals = shuffle(Array.from({ length: hi - lo + 1 }, (_, i) => lo + i)).slice(0, 3);
    const sh = pick([1, 2]);
    for (let r = 0; r < 3; r++) g.push([0, 1, 2].map(c => vals[(c + r * sh) % 3]));
  } else if (kind === 'arith') { // num only: col3 = col1 + col2 or col1 - col2
    const add = Math.random() < .5;
    for (let r = 0; r < 3; r++) {
      if (add) { const x = 1 + R(4), y = 1 + R(5 - x); g.push([x, y, x + y]); }
      else { const x = 3 + R(4), y = 1 + R(x - 2); g.push([x, y, x - y]); }
    }
  }
  return g;
}

function linesGrid(kind) {
  const g = [];
  for (let r = 0; r < 3; r++) {
    if (kind === 'none') { g.push([0, 0, 0]); continue; }
    if (kind === 'const') { const m = r === 0 ? rndMask(1, 2) : g[0][0]; g.push([m, m, m]); continue; }
    let a, b, c;
    for (;;) {
      a = rndMask(1, 3); b = rndMask(1, 3);
      if (a === b) continue;
      if (kind === 'or') { c = a | b; if (c === a || c === b) continue; }
      if (kind === 'xor') { c = a ^ b; if (!c) continue; }
      if (kind === 'sub') { c = a & ~b; if (!(a & b) || !c) continue; }
      break;
    }
    g.push([a, b, c]);
  }
  return g;
}

const LEVEL_VAR = [0, 1, 1, 2, 2, 3, 3, 3, 4];

function chartSVG() {
  const W = 340, H = 200, x0 = 30, y0 = 10, w = W - x0 - 8, h = H - y0 - 22;
  const lo = 70, hi = 160, Y = v => y0 + h - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * h;
  const rs = realSets();
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  const bands = [[70, 85, '#ff4d5e'], [85, 100, '#888'], [100, 115, '#6aa0ff'], [115, 125, '#49e07a'], [125, 135, '#8a6a12'], [135, 160, '#6b3fa0']];
  for (const [a, b, c] of bands) s += `<rect x="${x0}" y="${Y(b)}" width="${w}" height="${Y(a) - Y(b)}" fill="${c}" opacity=".08"/>`;
  for (const v of [70, 85, 100, 115, 125, 135, 160]) s += `<text x="${x0 - 4}" y="${Y(v) + 4}" fill="currentColor" opacity=".6" font-size="10" text-anchor="end">${v}</text>`;
  s += `<line x1="${x0}" x2="${x0 + w}" y1="${Y(130)}" y2="${Y(130)}" stroke="currentColor" stroke-dasharray="4 4" opacity=".45"/><text x="${x0 + w - 2}" y="${Y(130) - 4}" fill="currentColor" opacity=".6" font-size="10" text-anchor="end">Mensa</text>`;
  if (rs.length) {
    const X = i => x0 + (rs.length === 1 ? w / 2 : i / (rs.length - 1) * w);
    const pts = rs.map((r, i) => [X(i), Y(r.iq)]);
    if (pts.length > 1) s += `<polyline fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
    pts.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="currentColor"/><text x="${p[0]}" y="${p[1] - 9}" fill="currentColor" font-size="11" font-weight="800" text-anchor="middle">${rs[i].iq}</text>`; });
    s += `<text x="${x0}" y="${H - 4}" fill="currentColor" opacity=".6" font-size="10">${fmtDay(rs[0].day)}</text>${rs.length > 1 ? `<text x="${x0 + w}" y="${H - 4}" fill="currentColor" opacity=".6" font-size="10" text-anchor="end">${fmtDay(rs[rs.length - 1].day)}</text>` : ''}`;
  }
  return s + '</svg>';
}

function web(cx, cy, sx, sy, R) { // cobweb in a corner, sx/sy = direction
  let s = '', spokes = 5;
  const pts = [];
  for (let i = 0; i < spokes; i++) { const a = i / (spokes - 1) * Math.PI / 2; pts.push([Math.cos(a), Math.sin(a)]); s += `<line x1="${cx}" y1="${cy}" x2="${cx + sx * R * pts[i][0]}" y2="${cy + sy * R * pts[i][1]}"/>`; }
  for (const f of [.3, .55, .8]) for (let i = 0; i < spokes - 1; i++) {
    const a = pts[i], b = pts[i + 1], mx = (a[0] + b[0]) / 2 * f * R * .78, my = (a[1] + b[1]) / 2 * f * R * .78;
    s += `<path d="M${cx + sx * a[0] * f * R} ${cy + sy * a[1] * f * R} Q${cx + sx * mx} ${cy + sy * my} ${cx + sx * b[0] * f * R} ${cy + sy * b[1] * f * R}" fill="none"/>`;
  }
  return `<g stroke="#f4f4f4" stroke-width=".7" opacity=".85">${s}</g>`;
}

const stufeOf = kind => (kind === 'daily' || kind === 'reason') ? ((S.stufe || {})[kind] || 0) : 0;

  const items = kind === 'reason' ? reasonSet(st) : matrixSet(st);

  run = { kind, items, st, i: 0, res: [], t0: 0, raf: 0, lock: false };
  const d = document.createElement('div'); d.id = 'test'; document.body.appendChild(d);
  showItem();
}
function showItem() {
  const it = run.items[run.i], el = $('#test');
  const title = run.kind === 'reason' ? '🌀 Denksport' : '🧠 Matrizen';
  let h = `<div class="thead"><span>${title}</span><span>${run.st ? 'Stufe ' + run.st + ' · ' : ''}${run.i + 1}/10</span><button class="x" onclick="quitSet()">✕</button></div><div class="bar"><i id="tb"></i></div>`;
  if (it.kind === 'matrix') {
    h += `<div class="matrix">${it.panels.flat().map((p, k) => k === 8 ? '<div class="q">?</div>' : panelSVG(p)).join('')}</div>
      <div class="opts">${it.options.map((p, k) => `<button onclick="answer(${k},this)">${panelSVG(p)}</button>`).join('')}</div>`;
  } else if (it.kind === 'cube') {
    h += `<div class="rtarget net">${netSVG(it.net)}</div><div class="hint">Welcher Würfel lässt sich aus diesem Netz falten?</div>
      <div class="ropts cube">${it.options.map((c, k) => `<button onclick="answer(${k},this)">${cubeSVG(c)}</button>`).join('')}</div>`;
  } else if (it.kind === 'rot') {
    h += `<div class="rtarget rot">${polySVG(it.target)}</div><div class="hint">Welche Figur ist dieselbe, nur gedreht?</div>
      <div class="ropts rot">${it.options.map((c, k) => `<button onclick="answer(${k},this)">${polySVG(c, Math.max(...it.options.map(polySpan)))}</button>`).join('')}</div>`;
  } else if (it.kind === 'text') {
    h += `<div class="tq">${it.lines.join('<br>')}</div><div class="tquest">${it.q}</div>
      <div class="topts${it.wide ? ' wide' : ''}">${it.options.map((x, k) => `<button onclick="answer(${k},this)">${x}</button>`).join('')}</div>`;
  } else {
    h += `<div class="seq">${it.shown.map(x => `<b>${x}</b>`).join('')}<b class="q">?</b></div>
      <div class="sopts">${it.options.map((x, k) => `<button onclick="answer(${k},this)">${x}</button>`).join('')}</div>
      <div class="hint">Wie geht die Reihe weiter?</div>`;
  }
  el.innerHTML = h;
  run.lock = false; run.t0 = performance.now();
  cancelAnimationFrame(run.raf);
  const tick = () => {
    if (!run) return;
    const t = (performance.now() - run.t0) / 1000, f = Math.max(0, 1 - t / ITEM_SEC), tb = $('#tb');

      const d = row[1] - row[0];
      t = { type: d > 0 ? 'eine Ecke mehr pro Feld' : 'eine Ecke weniger pro Feld', num: d > 0 ? '+1 pro Feld' : '−1 pro Feld', size: d > 0 ? 'wird pro Feld größer' : 'wird pro Feld kleiner', color: d > 0 ? 'wird pro Feld dunkler' : 'wird pro Feld heller' }[a.replace(/^i(?=type|size|color)/, '')];
    } else if (it.rules[a] === 'dist3') t = 'drei Varianten, jede Zeile hat jede genau einmal';
    else if (it.rules[a] === 'arith') t = row[2] === row[0] + row[1] ? 'Feld 3 = Feld 1 + Feld 2' : 'Feld 3 = Feld 1 − Feld 2';
    else t = 'pro Zeile gleich';
    out.push(`<b>${it.nest && a === 'type' ? 'Äußere Form' : ATTR_DE[a]}:</b> ${t}`);
  }
  const L = { none: '', const: 'bleiben überall gleich', or: 'Feld 3 = alle Linien aus Feld 1 und 2 zusammen', xor: 'Feld 3 = nur Linien, die in genau einem der beiden Felder sind', sub: 'Feld 3 = Linien aus Feld 1 ohne die aus Feld 2' }[it.rules.lines];
  if (L) out.push(`<b>Linien:</b> ${L}`);
  if (out.length < 4) out.push('<span class="sub">Alles andere bleibt gleich.</span>');
  return out.join('<br>');
}
function reviewItem(it, i) {
  let h = `<div class="card" style="text-align:left"><div class="sub" style="margin-bottom:8px">Aufgabe ${i + 1}</div>`;
  if (it.kind === 'matrix') {
    h += `<div class="matrix" style="width:min(80vw,300px);margin:0 auto">${it.panels.flat().map((p, k) => k === 8 ? `<div style="outline:3px solid var(--grn);outline-offset:-3px">${panelSVG(p)}</div>` : panelSVG(p)).join('')}</div><p style="margin:12px 0 0;line-height:1.6">${ruleText(it)}</p>`;
  } else if (it.kind === 'cube') {
    h += `<div style="display:flex;gap:10px;align-items:center"><div class="rtarget" style="width:58%;margin:0;aspect-ratio:auto">${netSVG(it.net)}</div><div style="font-size:26px">→</div><div class="rtarget" style="width:34%;margin:0;padding:4px;outline:3px solid var(--grn)">${cubeSVG(it.options[it.answer])}</div></div><p class="sub" style="margin:10px 0 0">Gegenüberliegende Seiten sieht man nie zusammen, und die Reihenfolge rund um eine Ecke muss stimmen.</p>`;
  } else if (it.kind === 'rot') {
    h += `<div style="display:flex;gap:10px;align-items:center"><div class="rtarget" style="width:44%;margin:0">${polySVG(it.target)}</div><div style="font-size:26px">→</div><div class="rtarget" style="width:44%;margin:0;outline:3px solid var(--grn)">${polySVG(it.options[it.answer])}</div></div><p class="sub" style="margin:10px 0 0">Gleiche Figur, gedreht. Die anderen waren gespiegelt oder hatten einen Block an anderer Stelle.</p>`;
  } else if (it.kind === 'text') {
    h += `<div>${it.lines.join('<br>')}</div><div style="font-weight:800;margin-top:8px">${it.q}</div><div style="color:var(--grn);font-weight:800;margin-top:6px">✓ ${it.options[it.answer]}</div>`;
  } else {
    h += `<div class="seq" style="margin:0;justify-content:flex-start">${it.shown.map(x => `<b>${x}</b>`).join('')}<b class="q" style="color:var(--grn);border-color:var(--grn)">${it.options[it.answer]}</b></div>`;
  }
  return h + '</div>';
}
function review() {
  const r = review.run, missed = r.items.map((it, i) => [it, i]).filter(([, i]) => !r.res[i].ok);
  $('#test').innerHTML = `<div style="width:100%;max-width:440px"><div class="thead"><span>🔍 Fehleranalyse ${spk('review')}</span><span></span><button class="x" onclick="closeResult()">✕</button></div>
    <p class="sub">Jede Analyse macht dein Gehirn messbar stärker.</p>${missed.map(([it, i]) => reviewItem(it, i)).join('')}
    <button class="btn" onclick="closeResult()">Fertig</button></div>`;
  $('#test').scrollTop = 0;
}
function closeResult() { $('#test').remove(); tab = closeResult.kind === 'cold' ? 'id' : 'home'; render(); }

/* ---------- share card ---------- */
function shareCard() {
  const iq = (stats().last || S.cold).iq, t = tierOf(iq);
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1350;
  const g = c.getContext('2d');
  g.fillStyle = '#faf7ee'; g.fillRect(0, 0, 1080, 1350);
  g.fillStyle = '#1d1c19'; g.fillRect(0, 0, 1080, 18); g.fillRect(0, 1332, 1080, 18);
  g.textAlign = 'center';
  g.fillStyle = '#6c6555'; g.font = '700 30px monospace'; g.fillText('INSTITUT FÜR KOGNITIVE OPTIMIERUNG', 540, 110); g.fillStyle = '#1d1c19'; g.font = '800 64px monospace'; g.fillText('IQ MaXxing', 540, 190);
  g.fillStyle = '#6c6555'; g.font = '700 46px monospace'; g.fillText((S.name || 'Anonymes Genie').toUpperCase(), 540, 300);
  g.fillStyle = '#1d1c19'; g.font = '800 400px monospace'; g.fillText(String(iq), 540, 720);
  g.fillStyle = '#1d1c19'; g.font = '700 46px monospace'; g.fillText('BEFUND: IQ · AMTLICH GEMESSEN', 540, 820);
  g.strokeStyle = '#a3261d'; g.lineWidth = 10; g.save(); g.translate(540, 955); g.rotate(-0.06); g.strokeRect(-250, -55, 500, 110); g.restore();
  g.fillStyle = '#a3261d'; g.font = '800 58px monospace'; g.fillText(t[1], 540, 976);
  g.fillStyle = '#6c6555'; g.font = '600 36px monospace'; g.fillText('Stand ' + fmtDay(today()), 540, 1200);
  // shown as an image (long-press to save): downloads + Web Share are blocked inside the artifact viewer
  const ov = document.createElement('div'); ov.id = 'test';
  ov.innerHTML = `<div style="width:100%;max-width:440px;text-align:center"><img src="${c.toDataURL('image/png')}" style="width:100%;border-radius:14px;border:1px solid var(--line)">
    <p class="sub">Bild lange drücken → speichern oder teilen.</p>
    <button class="btn" id="shr" style="display:none">Teilen</button><button class="btn ghost" onclick="$('#test').remove()">Schließen</button></div>`;
  document.body.appendChild(ov);
  c.toBlob(b => {
    const f = new File([b], 'iq-' + iq + '.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        const s = $('#shr'); s.style.display = 'block';
        s.onclick = () => navigator.share({ files: [f], title: 'Mein IQ: ' + iq }).catch(() => { s.style.display = 'none'; });
      }
    } catch (e) {}
  }, 'image/png');
}

render();
</script>
