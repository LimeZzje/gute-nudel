<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gute Nudel</title>
<meta name="theme-color" content="#fffaf1">
<script>/* Android paints its system bars from this colour → always the colour of the tab bar, following dark mode live */
(() => { const m = document.querySelector('meta[name="theme-color"]'), q = matchMedia('(prefers-color-scheme: dark)'), f = () => { const t = document.documentElement.dataset.theme; m.content = (t ? t === 'dark' : q.matches) ? '#1f1d24' : '#fffaf1'; }; f(); q.addEventListener('change', f); })();</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pixel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <h1>Gute Nudel</h1>
  <button id="rankbtn" aria-label="Dein Rang"></button>
  <button id="stars" aria-label="Gute Nudel Sterne"><span class="s">★</span><span id="starsn">0</span></button>
  <button id="refresh" aria-label="Aktualisieren">↻</button>
  <button id="cloud" aria-label="Einstellungen und Sicherung">☁</button>
</header>
<main id="main"></main>
<nav id="tabs">
  <button data-tab="home" class="on"><span class="i">🍜</span>Home</button>
  <button data-tab="heute"><span class="i">📝</span>To-Dos</button>
  <button data-tab="ruhe"><span class="i">🏠</span>Daheim</button>
  <button data-tab="hello"><span class="i">🧺</span><span class="nl">Hello Nudel</span></button>
  <button data-tab="woche"><span class="i">✨</span>Woche</button>
  <button data-tab="schaetze"><span class="i">🎁</span>Schätze</button>
</nav>
<script type="module" src="app.js"></script>
</body>
</html>
